# Build and test on every push and pull request.
#
# The generated client is committed, so the build job compiles exactly what a consumer of the package
# gets. The verify-generated job re-runs scripts/regen.sh and fails on any diff.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HostTracker.Sdk.sln

      - name: Build
        run: dotnet build HostTracker.Sdk.sln -c Release --no-restore

      - name: Test
        run: dotnet test HostTracker.Sdk.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
        # The live smoke tests skip themselves without HT_BASE_URL, so CI runs the mocked suite only.

      - name: Pack
        run: dotnet pack src/HostTracker.Sdk/HostTracker.Sdk.csproj -c Release --no-build -o ./artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: ./artifacts/*.nupkg

  verify-generated:
    # Regenerating must be a no-op: a diff here means Generated/ was hand-edited, or the spec changed
    # without scripts/regen.sh being run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Is the published spec reachable?
        id: spec
        run: |
          url="https://raw.githubusercontent.com/HostTracker/openapi/main/openapi-3.0.json"
          if curl -fsSL -o /dev/null "$url"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$url is not published yet - skipping the regeneration check."
          fi

      - name: Regenerate
        if: steps.spec.outputs.available == 'true'
        run: ./scripts/regen.sh

      - name: Fail if the committed client is out of date
        if: steps.spec.outputs.available == 'true'
        run: |
          if ! git diff --quiet -- src/HostTracker.Sdk/Generated; then
            echo "::error::Generated/ differs from a fresh run of scripts/regen.sh."
            git diff --stat -- src/HostTracker.Sdk/Generated
            exit 1
          fi
