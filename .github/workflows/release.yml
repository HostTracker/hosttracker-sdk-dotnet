# Publish the package when a v* tag is pushed.
#
# Required secret (Settings -> Secrets and variables -> Actions on this repository):
#   NUGET_API_KEY - a nuget.org API key scoped to the `HostTracker.Sdk` package id.
#
# Until that secret exists the publish step is skipped, so the workflow still builds, tests and
# attaches the .nupkg/.snupkg to the GitHub release without failing.
#
# The tag drives the package version: v0.1.0 -> 0.1.0. Keep it in step with <Version> in
# src/HostTracker.Sdk/HostTracker.Sdk.csproj and with CHANGELOG.md.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level env, so the publish step's `if` can see whether the secret is set at all
    # (the `secrets` context is not available in a step condition).
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          dotnet build HostTracker.Sdk.sln -c Release
          dotnet test HostTracker.Sdk.sln -c Release --no-build

      - name: Pack
        run: >
          dotnet pack src/HostTracker.Sdk/HostTracker.Sdk.csproj
          -c Release --no-build -o ./artifacts
          -p:Version=${{ steps.version.outputs.value }}

      - name: Publish to nuget.org
        if: ${{ env.NUGET_API_KEY != '' }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate

      - name: Attach the packages to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          generate_release_notes: true
